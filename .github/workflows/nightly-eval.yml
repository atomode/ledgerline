# Full golden set against the real model every night. Opens (or updates) one issue when any
# threshold fails, so a slow drift can't hide behind green PR subsets.
name: nightly-eval

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Extraction model to evaluate
        default: claude-sonnet-5-5

concurrency:
  group: nightly-eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL: ${{ inputs.model || 'claude-sonnet-5-5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: evals/.cache
          key: eval-${{ hashFiles('evals/golden/**', 'packages/extraction/src/**') }}
          restore-keys: eval-
      - run: pnpm install --frozen-lockfile && pnpm build
      - id: eval
        continue-on-error: true
        run: pnpm eval --model "$MODEL" --out reports/nightly
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-report-${{ github.run_id }}
          path: evals/reports/
          retention-days: 90
      - name: Open or update the regression issue
        if: steps.eval.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("node:fs");
            const report = fs.existsSync("evals/reports/nightly.md")
              ? fs.readFileSync("evals/reports/nightly.md", "utf8")
              : "The eval did not produce a report; see the run log.";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Nightly eval failed (${process.env.MODEL}). [Run](${run})\n\n${report}`.slice(0, 65000);
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "eval-regression",
            });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({
                ...context.repo, title: "Nightly eval below threshold", labels: ["eval-regression"], body,
              });
            }
      - name: Fail the run
        if: steps.eval.outcome == 'failure'
        run: exit 1
