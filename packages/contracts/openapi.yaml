        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many requests or pipeline backlog; honor Retry-After
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/invoices/{id}:
    get:
      operationId: getInvoice
