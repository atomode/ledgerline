servers:
  - url: http://localhost:3000
    description: Local development
webhooks:
  invoiceEvent:
    post:
      operationId: invoiceEvent
      summary: Invoice lifecycle event
      security: []
      description: 'Signed with the `ledgerline-signature` header: `t=<unix>,v1=<hex
        HMAC-SHA256 of "<t>.<raw body>">`. Reject if older than 300s. Dedupe on
        `id`.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        2XX:
          description: Acknowledged
security:
  - apiKey: []
tags:
  - name: uploads
    description: Bulk invoice upload via presigned URLs
  - name: invoices
    description: Extracted invoices and the human review queue
  - name: admin
    description: Dead-letter inspection and replay
  - name: ops
    description: Health probes (unauthenticated)
