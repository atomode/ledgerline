          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        results:
          type: array
          items:
            $ref: "#/components/schemas/FileResult"
        counts:
          type: object
          properties:
            accepted:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            duplicate:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            rejected:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
          required:
            - accepted
            - duplicate
            - rejected
          additionalProperties: false
      required:
        - sessionId
        - results
        - counts
      additionalProperties: false
    DlqItem:
      type: object
      properties:
        jobId:
          type: string
        queue:
          type: string
        failedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
        attemptsMade:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        errorChain:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              message:
                type: string
            required:
              - name
              - message
            additionalProperties: false
        replayedAt:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
            - type: "null"
      required:
        - jobId
        - queue
        - failedAt
        - attemptsMade
        - errorChain
        - replayedAt
      additionalProperties: false
    ReplayResponse:
      type: object
      properties:
        jobId:
          type: string
        newJobId:
          type: string
        queue:
          type: string
      required:
        - jobId
        - newJobId
        - queue
      additionalProperties: false
    WebhookEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          description: Unique per event. Consumers dedupe on this.
        type:
          type: string
          enum:
            - invoice.approved
            - invoice.needs_review
            - invoice.rejected
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
        data:
          type: object
          properties:
            invoiceId:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            status:
              $ref: "#/components/schemas/InvoiceStatus"
            vendorId:
              anyOf:
                - type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                - type: "null"
            invoiceNumber:
              type:
                - string
                - "null"
            total:
              anyOf:
                - $ref: "#/components/schemas/Money"
                - type: "null"
          required:
            - invoiceId
            - status
            - vendorId
            - invoiceNumber
            - total
          additionalProperties: false
      required:
        - id
        - type
        - createdAt
        - data
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          const: ok
      required:
        - status
      additionalProperties: false
    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        checks:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: object
            properties:
              ok:
                type: boolean
              latencyMs:
                type: number
              error:
                type: string
            required:
              - ok
              - latencyMs
            additionalProperties: false
      required:
        - status
        - checks
      additionalProperties: false
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness probe
      tags:
        - ops
      security: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe (checks Postgres and Redis)
      tags:
        - ops
      security: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /v1/upload-sessions:
    post:
      operationId: createUploadSession
      summary: Create an upload session with presigned PUT URLs (max 200 files)
      tags:
        - uploads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadSessionRequestInput"
      parameters:
        - schema:
            type: string
            minLength: 8
            maxLength: 255
          in: header
          name: idempotency-key
          required: false
          description: Retries with the same key and body return the original response.
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many requests or pipeline backlog; honor Retry-After
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/upload-sessions/{id}/complete:
    post:
      operationId: completeUploadSession
      summary: Finish a session; returns a per-file result (accepted, duplicate,
        rejected)
      tags:
        - uploads
      description: "Partial success is normal: the response is 202 when at least one
        file is accepted, and each file carries its own status."
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: id
          required: true
        - schema:
            type: string
            minLength: 8
            maxLength: 255
          in: header
          name: idempotency-key
          required: false
          description: Retries with the same key and body return the original response.
      responses:
        "200":
          description: No file was accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteUploadSessionResponse"
        "202":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteUploadSessionResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: Session expired before completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many requests or pipeline backlog; honor Retry-After
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "501":
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/invoices:
